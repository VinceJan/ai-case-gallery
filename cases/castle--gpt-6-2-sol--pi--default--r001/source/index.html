<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e6e3d4">
  <meta name="description" content="在微缩的中世纪领地中漫游，观看城堡、田野与四种天气。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23757861'/%3E%3Cpath fill='%23ede3ca' d='M7 10h4v4h3v-4h4v4h3v-4h4v15h-6v-6h-6v6H7z'/%3E%3C/svg%3E">
  <title>蓟丘领 · Thistle Manor</title>
</head>
<body>
  <main id="stage" aria-label="蓟丘领微缩三维场景">
    <div id="loading" role="status">正在搭建蓟丘领…</div>
    <div id="canvas-slot"></div>
  </main>
  <button id="weather-trigger" class="weather-trigger" type="button" commandfor="weather-panel" command="toggle-popover" aria-label="天气设置 (W)" aria-keyshortcuts="W" aria-controls="weather-panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg>
  </button>
  <section id="weather-panel" popover aria-labelledby="weather-title">
    <header class="weather-heading">
      <div class="eyebrow">蓟丘领 / THISTLE MANOR</div>
      <h1 id="weather-title">领地天气</h1>
      <button id="weather-close" class="weather-close" type="button" commandfor="weather-panel" command="hide-popover" aria-label="关闭天气面板">×</button>
    </header>
    <fieldset class="weather-options">
      <legend class="sr-only">天气模式</legend>
      <label><input name="weather" type="radio" value="sun" checked autofocus><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg><b>晴朗</b><small>暖阳微风</small></span></label>
      <label><input name="weather" type="radio" value="cloud"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18a4 4 0 1 1 .8-7.92 5.2 5.2 0 0 1 10.14.65A3.7 3.7 0 1 1 18 18Z"/></svg><b>多云</b><small>云影掠过</small></span></label>
      <label><input name="weather" type="radio" value="rain"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14a3.3 3.3 0 1 1 .7-6.53 4.8 4.8 0 0 1 9.5.55A3 3 0 1 1 18 14ZM8 17l-1 3m6-3-1 3m6-3-1 3"/></svg><b>细雨</b><small>水面溅起涟漪</small></span></label>
      <label><input name="weather" type="radio" value="mist"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a3 3 0 0 1 3-3h5a4 4 0 0 1 3.9 3M3 13h17M6 17h15M3 21h13"/></svg><b>晨雾</b><small>雾气漫过城垣</small></span></label>
    </fieldset>
    <label class="weather-cycle"><input type="checkbox" id="weather-cycle"><span>自动轮换天气</span></label>
    <footer><span>拖拽旋转 · 滚轮 / 双指缩放</span><kbd>W</kbd></footer>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
