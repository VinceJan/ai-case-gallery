<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雨夜のコンビニ街角 — Rainy Konbini Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #05070e; overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  #veil { position: fixed; inset: 0; background: #05070e; pointer-events: none; z-index: 2; transition: opacity 1.6s ease .25s; }
  body.ready #veil { opacity: 0; }
  body.shot #veil { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="雨夜のコンビニ街角 — a miniature rainy-night convenience store corner"></canvas>
<div id="veil"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
