<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>🌸</text></svg>" />
    <title>樱花小镇 · Sakura Town</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #1a2230;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        color: #f4f0e8;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }

      /* HUD */
      .hud {
        position: absolute; inset: 0; pointer-events: none;
        z-index: 10;
      }
      .hud-top {
        position: absolute; top: 16px; left: 16px; right: 16px;
        display: flex; justify-content: space-between; align-items: flex-start;
        gap: 12px;
      }
      .panel {
        background: rgba(20, 28, 42, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 10px 14px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      }
      .clock-panel { min-width: 168px; }
      .clock-time {
        font-size: 28px; font-weight: 600; letter-spacing: 0.5px;
        line-height: 1.1; color: #fff7ea;
      }
      .clock-meta {
        margin-top: 4px; font-size: 12px; opacity: 0.85;
        display: flex; gap: 8px; flex-wrap: wrap;
      }
      .stat-panel {
        display: flex; gap: 16px; align-items: center;
      }
      .stat {
        display: flex; flex-direction: column; gap: 2px;
        min-width: 64px;
      }
      .stat-label { font-size: 11px; opacity: 0.7; letter-spacing: 0.4px; }
      .stat-value { font-size: 16px; font-weight: 600; color: #ffe9b0; }

      .quest-panel {
        position: absolute; top: 110px; left: 16px;
        width: min(280px, calc(100vw - 32px));
        pointer-events: none;
      }
      .quest-title {
        font-size: 11px; letter-spacing: 1.5px; opacity: 0.7;
        margin-bottom: 6px; text-transform: uppercase;
      }
      .quest-item {
        padding: 8px 10px; border-radius: 8px;
        background: rgba(255,255,255,0.08);
        border-left: 3px solid #f0b429;
        margin-bottom: 6px;
        font-size: 13px; line-height: 1.45;
      }
      .quest-item.done {
        opacity: 0.45;
        border-left-color: #6fbf73;
        text-decoration: line-through;
      }

      .toast-stack {
        position: absolute; bottom: 96px; left: 50%;
        transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 8px;
        align-items: center; width: min(420px, calc(100vw - 32px));
      }
      .toast {
        background: rgba(20, 28, 42, 0.88);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
        animation: toast-in 0.28s ease;
        text-align: center;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .interact-hint {
        position: absolute; bottom: 120px; left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 28, 42, 0.85);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        display: none;
        white-space: nowrap;
      }
      .interact-hint.visible { display: block; }
      .key {
        display: inline-block;
        background: rgba(255,255,255,0.14);
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 6px;
        padding: 1px 8px;
        margin-right: 6px;
        font-size: 12px;
        font-weight: 600;
      }

      .controls-hint {
        position: absolute; bottom: 16px; left: 16px;
        font-size: 12px; opacity: 0.72;
        line-height: 1.7;
        max-width: 320px;
      }

      .dialogue {
        position: absolute; left: 50%; bottom: 28px;
        transform: translateX(-50%);
        width: min(640px, calc(100vw - 32px));
        background: rgba(18, 24, 38, 0.92);
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 16px;
        padding: 18px 22px;
        display: none;
        pointer-events: auto;
        box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      }
      .dialogue.visible { display: block; }
      .dialogue-speaker {
        font-size: 13px; font-weight: 600;
        color: #f0b429; margin-bottom: 8px;
        letter-spacing: 0.5px;
      }
      .dialogue-text {
        font-size: 15px; line-height: 1.7;
        color: #f5f1ea; min-height: 52px;
      }
      .dialogue-choices {
        margin-top: 12px; display: flex; flex-direction: column; gap: 8px;
      }
      .dialogue-choice {
        text-align: left;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        color: inherit;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-family: inherit;
      }
      .dialogue-choice:hover {
        background: rgba(240, 180, 41, 0.18);
        border-color: rgba(240, 180, 41, 0.45);
      }
      .dialogue-continue {
        margin-top: 10px; text-align: right;
        font-size: 12px; opacity: 0.65;
      }

      .map-toggle {
        position: absolute; top: 16px; left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
      }
      .icon-btn {
        background: rgba(20, 28, 42, 0.72);
        border: 1px solid rgba(255,255,255,0.14);
        color: #f4f0e8;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .icon-btn:hover { background: rgba(240, 180, 41, 0.22); }

      .map-overlay {
        position: absolute; inset: 0;
        background: rgba(10, 14, 24, 0.82);
        display: none;
        pointer-events: auto;
        z-index: 20;
        overflow: auto;
      }
      .map-overlay.visible { display: flex; align-items: center; justify-content: center; }
      .map-card {
        width: min(720px, calc(100vw - 32px));
        background: rgba(22, 30, 46, 0.95);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 20px;
      }
      .map-card h2 {
        font-size: 18px; font-weight: 600; margin-bottom: 12px;
        color: #ffe9b0;
      }
      .map-legend {
        display: flex; flex-wrap: wrap; gap: 10px;
        margin-top: 14px; font-size: 12px;
      }
      .legend-item {
        display: flex; align-items: center; gap: 6px;
        opacity: 0.9;
      }
      .legend-dot {
        width: 10px; height: 10px; border-radius: 50%;
      }

      .title-screen {
        position: absolute; inset: 0;
        background: linear-gradient(160deg, #2a3550 0%, #4a3a58 40%, #c4788a 100%);
        z-index: 50;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        pointer-events: auto;
      }
      .title-screen.hidden { display: none; }
      .title-logo {
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 700;
        letter-spacing: 4px;
        color: #fff8f0;
        text-shadow: 0 8px 32px rgba(0,0,0,0.35);
      }
      .title-sub {
        font-size: 15px; opacity: 0.85; letter-spacing: 6px;
        margin-top: -8px;
      }
      .title-desc {
        max-width: 420px; text-align: center;
        font-size: 14px; line-height: 1.8; opacity: 0.88;
        padding: 0 16px;
      }
      .title-btn {
        margin-top: 12px;
        background: #fff8f0;
        color: #2a2430;
        border: none;
        border-radius: 999px;
        padding: 14px 42px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 2px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .title-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      }
      .title-foot {
        position: absolute; bottom: 24px;
        font-size: 11px; opacity: 0.55; letter-spacing: 1px;
      }

      .loading-bar {
        width: 220px; height: 3px;
        background: rgba(255,255,255,0.15);
        border-radius: 999px; overflow: hidden;
      }
      .loading-bar > div {
        height: 100%; width: 0%;
        background: #fff8f0;
        transition: width 0.2s ease;
      }

      .fade {
        position: absolute; inset: 0;
        background: #0a0e18;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
        z-index: 40;
      }
      .fade.visible { opacity: 1; pointer-events: auto; }

      .mobile-stick {
        position: absolute; left: 24px; bottom: 28px;
        width: 120px; height: 120px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
        pointer-events: auto;
        display: none;
        touch-action: none;
      }
      .mobile-stick .knob {
        position: absolute; left: 50%; top: 50%;
        width: 48px; height: 48px;
        margin: -24px 0 0 -24px;
        border-radius: 50%;
        background: rgba(255,255,255,0.28);
      }
      .mobile-action {
        position: absolute; right: 24px; bottom: 40px;
        width: 72px; height: 72px;
        border-radius: 50%;
        background: rgba(240, 180, 41, 0.35);
        border: 1px solid rgba(240, 180, 41, 0.55);
        color: #fff;
        font-size: 18px; font-weight: 700;
        display: none;
        pointer-events: auto;
        font-family: inherit;
      }
      @media (max-width: 720px), (pointer: coarse) {
        .controls-hint { display: none; }
        .mobile-stick, .mobile-action { display: block; }
        .clock-time { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="title-screen" id="title-screen">
        <div class="title-logo">樱花小镇</div>
        <div class="title-sub">SAKURA TOWN</div>
        <div class="title-desc">
          一座会自己生活的小镇。<br />
          电车准点经过，居民各有去处，<br />
          而你会慢慢成为这里的一部分。
        </div>
        <button class="title-btn" id="start-btn">进入小镇</button>
        <div class="loading-bar"><div id="loading-fill"></div></div>
        <div class="title-foot">WASD 移动 · 鼠标视角 · E 交互 · Shift 奔跑</div>
      </div>

      <div class="hud" id="hud" style="display:none">
        <div class="hud-top">
          <div class="panel clock-panel">
            <div class="clock-time" id="clock-time">08:00</div>
            <div class="clock-meta">
              <span id="clock-day">周一</span>
              <span id="clock-date">4月12日</span>
              <span id="clock-weather">晴</span>
            </div>
          </div>
          <div class="panel stat-panel">
            <div class="stat">
              <div class="stat-label">金钱</div>
              <div class="stat-value" id="stat-money">¥2,000</div>
            </div>
            <div class="stat">
              <div class="stat-label">好感</div>
              <div class="stat-value" id="stat-bond">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">帮助</div>
              <div class="stat-value" id="stat-helps">0</div>
            </div>
          </div>
        </div>

        <div class="map-toggle">
          <button class="icon-btn" id="map-btn">地图 M</button>
        </div>

        <div class="quest-panel panel" id="quest-panel" style="background:transparent;border:none;box-shadow:none;padding:0">
          <div class="quest-title">今日待办</div>
          <div id="quest-list"></div>
        </div>

        <div class="interact-hint" id="interact-hint">
          <span class="key">E</span><span id="interact-text">交互</span>
        </div>

        <div class="toast-stack" id="toast-stack"></div>

        <div class="controls-hint">
          WASD 移动 · Shift 奔跑 · E 交互/对话 · F 坐下<br />
          鼠标拖动视角 · M 地图 · Esc 关闭界面
        </div>

        <div class="dialogue" id="dialogue">
          <div class="dialogue-speaker" id="dialogue-speaker">？？？</div>
          <div class="dialogue-text" id="dialogue-text"></div>
          <div class="dialogue-choices" id="dialogue-choices"></div>
          <div class="dialogue-continue">点击继续</div>
        </div>
      </div>

      <div class="map-overlay" id="map-overlay">
        <div class="map-card">
          <h2>樱花小镇 · 小镇地图</h2>
          <div id="map-canvas-wrap"></div>
          <div class="map-legend" id="map-legend"></div>
          <div style="margin-top:14px;text-align:right">
            <button class="icon-btn" id="map-close">关闭</button>
          </div>
        </div>
      </div>

      <div class="mobile-stick" id="mobile-stick"><div class="knob" id="mobile-knob"></div></div>
      <button class="mobile-action" id="mobile-action">E</button>

      <div class="fade" id="fade"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
