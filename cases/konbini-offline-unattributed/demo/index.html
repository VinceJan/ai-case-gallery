<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>雨夜コンビニ街角 — Rainy Night Corner</title>
<meta name="description" content="三渲二风格的雨夜日式便利店街角微缩模型：可自由旋转缩放，持续降雨、屋檐滴水、积水波纹、自动门开合。" />
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #05060c;
}

#scene {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

/* Cinematic vignette + faint film grain: pure image grading, no UI. */
#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 78% 68% at 50% 46%, rgba(0,0,0,0) 42%, rgba(3,4,10,0.34) 74%, rgba(2,3,8,0.66) 100%),
    linear-gradient(to bottom, rgba(24,34,66,0.10), rgba(0,0,0,0) 30%);
  mix-blend-mode: multiply;
}

#grain {
  position: fixed;
  inset: -50%;
  pointer-events: none;
  opacity: 0.035;
  background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
  background-size: 3px 3px;
  animation: grainShift 0.9s steps(3) infinite;
}

@keyframes grainShift {
  0%   { transform: translate(0, 0); }
  33%  { transform: translate(-2px, 1px); }
  66%  { transform: translate(1px, -2px); }
  100% { transform: translate(0, 0); }
}

</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
