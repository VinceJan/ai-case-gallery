<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雨夜のコンビニ - Rainy Night Convenience Store Diorama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a12;
    }
    #webgl-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
