#hud {

  color: #e9eef4; user-select: none; width: 208px;

#hud .panel {
  background: linear-gradient(180deg, rgba(20,27,38,.88), rgba(16,22,31,.92));
  border: 1px solid rgba(150,180,210,.22); border-radius: 10px;
  box-shadow: 0 10px 26px rgba(0,0,0,.35); padding: 10px 11px 11px;
  backdrop-filter: blur(6px);

  flex: 1 1 auto; min-width: 34px; padding: 5px 4px; cursor: pointer;
  background: rgba(255,255,255,.06); color: #dfe8f2;
  border: 1px solid rgba(160,190,220,.18); border-radius: 6px;

#hud input[type=range] { width: 100%; accent-color: #e8b64c; height: 16px; }

#hud .chk.on i { background: #e8b64c; border-color: #e8b64c; }

  position: fixed; left: 14px; top: 14px; z-index: 21; cursor: pointer;
